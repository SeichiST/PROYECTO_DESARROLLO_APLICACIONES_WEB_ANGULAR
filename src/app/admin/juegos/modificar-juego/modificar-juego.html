<div class="container mt-5">
  <div class="card card-admin p-4 shadow-lg">
    <h1 class="text-center text-white mb-4">Modificar Juego #{{ juego.idJuegos }}</h1>
    <div class="row d-flex justify-content-center">
      <div class="col-md-8">
        <form class="row g-3" (ngSubmit)="actualizarJuego()">
          <div class="col-md-12">
            <label class="form-label text-white">Descripción</label>
            <input type="text" class="form-control" name="descripcion" [(ngModel)]="juego.descripcion" required>
          </div>

          <div class="col-md-6">
            <label class="form-label text-white">Categoría</label>
            <select class="form-select" name="categoria" [(ngModel)]="juego.categoria.idCategoria">
              @for (cat of lstCategorias; track $index) {
                <option [value]="cat.idCategoria">{{ cat.descripcion }}</option>
              }
            </select>
          </div>

          <div class="col-md-6">
            <label class="form-label text-white">Precio</label>
            <input type="number" step="0.01" class="form-control" name="precio" [(ngModel)]="juego.precio" required>
          </div>

          <div class="col-md-12">
            <label class="form-label text-white">Cambiar imagen (opcional)</label>
            <input type="file" (change)="onFileSelected($event)" class="form-control" accept="image/*">
            <p class="text-muted mt-2">Imagen actual: <span>{{ juego.imagen }}</span></p>
          </div>

          <div class="col-md-12 d-flex justify-content-between mt-4">
            <button type="button" (click)="goListaJuegos()" class="btn btn-outline-light">Regresar</button>
            <button type="submit" class="btn btn-primary">Guardar Cambios</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
