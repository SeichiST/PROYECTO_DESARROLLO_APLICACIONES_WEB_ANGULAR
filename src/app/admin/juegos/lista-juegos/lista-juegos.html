<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0 text-white">
      Catálogo de Juegos <span class="badge bg-primary">{{ juegoList.length }}</span>
    </h2>
    <button (click)="goNewJuego()" type="button" class="btn btn-primary">Nuevo Juego</button>
  </div>
  
  <hr class="text-white" />

  <div class="card card-admin p-4 shadow-lg">
    <div class="table-responsive">
      <table class="table table-hover align-middle m-0">
        <thead class="table-dark">
          <tr>
            <th scope="col" class="text-center">ID</th>
            <th scope="col">Imagen</th>
            <th scope="col">Descripción</th>
            <th scope="col" class="text-end">Monto</th>
          </tr>
        </thead>
        <tbody>
          @for (item of juegoList; track $index) {
            <tr style="cursor: pointer;" (click)="goDetailJuego(item.idjuegos)">
              <th scope="row" class="text-center">{{ item.idjuegos }}</th>
              <td><img [src]="'http://localhost:8085/uploads/juegos/' + item.imagen" class="img-fluid" style="max-height: 70px;" alt="Portada"></td>
              <td>{{ item.descripcion }}</td>
              <td class="text-end">S/. {{ item.precio }}</td>
            </tr>
          } @empty {
            <tr>
              <td colspan="4" class="text-center text-muted py-4">Cargando catálogo...</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
