<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0 text-white">Bandeja de Mensajes</h2>
  </div>

  <div class="card card-admin p-4 shadow-lg">
    <table class="table table-hover align-middle">
      <thead class="table-dark">
        <tr>
          <th>#</th>
          <th>Fecha</th>
          <th>Nombre</th>
          <th>Email</th>
          <th>Teléfono</th>
          <th>Mensaje</th>
        </tr>
      </thead>
      <tbody>
        @for (m of lstMensajes; track $index) {
          <tr>
            <td>{{ m.idMensaje }}</td>
            <td class="text-nowrap">{{ m.fechaEnvio }}</td>
            <td>{{ m.cliente?.nombres }} {{ m.cliente?.apellidos }}</td>
            <td>{{ m.cliente?.correo }}</td>
            <td>{{ m.cliente?.telefono }}</td>
            <td class="text-break" style="min-width: 250px; max-width: 400px;">{{ m.mensaje }}</td>
          </tr>
        } @empty {
          <tr>
            <td colspan="6" class="text-center text-muted py-4">No hay mensajes recibidos.</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
