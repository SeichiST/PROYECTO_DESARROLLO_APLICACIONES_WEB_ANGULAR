<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0">Gestión de Categorías</h2>
    <button type="button" (click)="goRegistrarCategoria()" class="btn btn-success px-4 py-2">Registrar</button>
  </div>

  <div class="card card-admin p-4 shadow-lg">
    <table class="table table-hover align-middle">
      <thead class="table-dark">
        <tr>
          <th>ID Categoría</th>
          <th>Descripción</th>
          <th class="text-center">Acciones</th>
        </tr>
      </thead>
      <tbody>
        @for (categoria of lstCategorias; track $index) {
          <tr>
            <td>{{ categoria.idCategoria }}</td>
            <td>{{ categoria.descripcion }}</td>
            <td class="text-center">
              <button type="button" (click)="goModificarCategoria(categoria.idCategoria)" class="btn btn-sm btn-primary">Editar</button>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="3" class="text-center text-muted py-4">No hay categorías disponibles.</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
