<app-header />

<main style="min-height: calc(100vh - 160px); padding-top: 2rem; padding-bottom: 2rem;">
  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="text-uppercase fw-bold m-0 text-white">
        <i class="bi bi-bag-heart-fill text-warning"></i> Mis Compras
      </h2>
      <button type="button" (click)="goInicio()" class="btn btn-outline-light px-4 py-2" style="max-width: 200px;">
        <i class="bi bi-house-door-fill me-2"></i>Ir al Inicio
      </button>
    </div>

    <div class="card card-admin p-4 shadow-lg">
      <table class="table table-hover align-middle">
        <thead class="table-dark">
          <tr>
            <th>Código de Orden</th>
            <th>Fecha de Compra</th>
            <th class="text-end">Total Pagado</th>
            <th class="text-center">Acciones</th>
          </tr>
        </thead>
        <tbody>
          @for (v of lstVentas; track v.idventa) {
            <tr>
              <td>#{{ v.idventa }}</td>
              <td>{{ v.fechaventa | date:'dd/MM/yyyy HH:mm' }}</td>
              <td class="text-end fw-bold text-warning">S/. {{ v.montototal }}</td>
              <td class="text-center">
                <button type="button" (click)="goDetalleCompra(v.idventa)" class="btn btn-sm btn-info text-white me-2">
                  <i class="bi bi-eye-fill"></i> Ver Detalles
                </button>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="4" class="text-center text-muted py-4">Aún no has realizado ninguna compra en la tienda.</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</main>

<app-footer />
